  profile: >
    AI trainer and consultant who turns generative and agentic AI into day-to-day
    capability for organisations. In 2026 alone he has delivered hands-on programmes
    for the Royal Malaysia Police, a university hospital, the Government e-procurement
    operator (Commerce Dot Com),
    university faculties and libraries, and visiting cohorts from China — from
    one-hour webinars to multi-day professional-certificate modules. Appointed an AI
    Champion by Malaysia's Ministry of Higher Education, he designs his own training
    modules (five registered as copyrights at UKM) and keeps them current through
    continuous certification, including Anthropic's Claude and Microsoft–LinkedIn
    generative-AI tracks. Behind the training sits a research record of 113
    publications, a Ph.D. in Evolutionary Computing and RM 1.51M in competitive
    grants, including a national project building a large language model for the
    Malay language. Senior Lecturer at Universiti Kebangsaan Malaysia, previously
    Assistant Professor at JAIST, Japan.

