profile: >
  Artificial-intelligence researcher and educator specializing in game informatics,
  computational intelligence, and intelligent/expert systems. PhD in Evolutionary
  Computing (Universiti Sains Malaysia, 2018), with a prior appointment as Assistant
  Professor at the Japan Advanced Institute of Science and Technology (JAIST), where he
  co-founded the International Research Center for AI and Entertainment Science. Currently
  a Senior Lecturer at Universiti Kebangsaan Malaysia and Research Coordinator at CAIT,
  leading grants totalling over RM 920K — including a national flagship on large language
  models for the Malay language. Author of 113 publications with 1,153 citations
  (h-index 18, i10-index 31) and supervisor of 14 postgraduate researchers. A certified
  Professional Technologist (MBOT), IEEE and AAAI member, guest editor and regular referee
  for Elsevier and IEEE journals.

researchFocus:
  - accent: "blue"
    title: "Game Informatics"
    text: "Game analytics & design, entertainment science, game-playing AI agents, game-tree search, gamification, empathic entertainment, archaeogaming"
  - accent: "teal"
    title: "Computational Intelligence"
    text: "Bio-inspired & evolutionary computing, computational modeling, machine learning, agent-based systems, cellular automata, computational psychometrics"
  - accent: "purple"
    title: "Expert Systems & LLMs"
    text: "Large language models, intelligent search, case-based reasoning, knowledge-based systems, data-driven decision making & business intelligence"

