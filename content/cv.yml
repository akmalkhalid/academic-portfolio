profile: >
  Artificial-intelligence researcher and educator working on computational intelligence
  for games and engagement modelling — spanning nature-inspired optimization, game
  informatics & entertainment science, and generative/agentic AI. PhD in Evolutionary
  Computing (Universiti Sains Malaysia, 2018), with a prior appointment as Assistant
  Professor at the Japan Advanced Institute of Science and Technology (JAIST), where he
  co-founded the International Research Center for AI and Entertainment Science. Currently
  a Senior Lecturer at Universiti Kebangsaan Malaysia and Research Coordinator at CAIT,
  leading RM 575,300 as principal investigator within a cumulative RM 1.51M across ten competitive grants — including a national flagship on large language
  models for the Malay language. Author of 113 publications with 1,153 citations
  (h-index 18, i10-index 31) and supervisor of 14 postgraduate researchers. A certified
  Professional Technologist (MBOT), IEEE and AAAI member, guest editor and regular referee
  for Elsevier and IEEE journals.

researchFocus:
  - accent: "teal"
    title: "Computational Intelligence & Optimization"
    text: "Nature-inspired metaheuristics — genetic & immune algorithms, swarm intelligence, memetic hybrids; assembly-line balancing, production scheduling, large-scale combinatorial & continuous optimization"
  - accent: "amber"
    title: "Games Informatics & Engagement Modelling"
    text: "Game-refinement theory & the “motion in mind” model; measuring and optimizing engagement, addiction & player experience; procedural content generation, gamification, serious games, agent-based simulation"
  - accent: "purple"
    title: "Generative & Agentic AI"
    text: "Large language models and generative models (transformers, diffusion, GANs) coupled with symbolic and knowledge-based reasoning; agentic content generation, explainable decision support"

